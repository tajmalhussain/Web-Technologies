<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grade Calculator</title>
<style>
body{font-family:Arial;background:#eef4f8;margin:0}.box{max-width:650px;margin:50px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 8px 25px #0002}h1{color:#155d8a}input{width:100%;padding:11px;margin:7px 0 14px;box-sizing:border-box}button{padding:12px 20px;background:#155d8a;color:white;border:0;border-radius:7px}#result{margin-top:20px;padding:18px;background:#eef8ff;border-left:5px solid #155d8a}
</style>
</head>
<body>
<div class="box">
<h1>Student Grade Calculator</h1>
<p>Enter marks for five subjects (0–100).</p>
<label>Subject 1 <input id="m1" type="number" min="0" max="100"></label>
<label>Subject 2 <input id="m2" type="number" min="0" max="100"></label>
<label>Subject 3 <input id="m3" type="number" min="0" max="100"></label>
<label>Subject 4 <input id="m4" type="number" min="0" max="100"></label>
<label>Subject 5 <input id="m5" type="number" min="0" max="100"></label>
<button onclick="calculateGrade()">Calculate</button>
<div id="result"></div>
</div>
<script>
function calculateGrade(){
  const marks = [
    Number(document.getElementById("m1").value),
    Number(document.getElementById("m2").value),
    Number(document.getElementById("m3").value),
    Number(document.getElementById("m4").value),
    Number(document.getElementById("m5").value)
  ];

  if(marks.some(mark => Number.isNaN(mark) || mark < 0 || mark > 100)){
    document.getElementById("result").innerHTML = "Please enter valid marks between 0 and 100.";
    return;
  }

  const total = marks.reduce((sum, mark) => sum + mark, 0);
  const average = total / marks.length;
  let grade;

  if(average >= 90) grade = "A+";
  else if(average >= 80) grade = "A";
  else if(average >= 70) grade = "B";
  else if(average >= 60) grade = "C";
  else if(average >= 50) grade = "D";
  else grade = "F";

  const status = marks.every(mark => mark >= 40) ? "PASS" : "FAIL";

  document.getElementById("result").innerHTML =
    "<b>Total:</b> " + total + "/500<br>" +
    "<b>Average:</b> " + average.toFixed(2) + "<br>" +
    "<b>Grade:</b> " + grade + "<br>" +
    "<b>Status:</b> " + status;
}
</script>
</body>
</html>
