<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supermarket Billing System</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0}.box{max-width:750px;margin:40px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 8px 25px #0002}h1{color:#155d8a}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{border:1px solid #ccd6df;padding:12px}th{background:#e8f3fb}input{width:95%;padding:9px}button{padding:12px 22px;border:0;border-radius:7px;background:#155d8a;color:white;cursor:pointer}#bill{margin-top:20px;padding:18px;background:#eef8ff}
</style>
</head>
<body>
<div class="box">
<h1>Supermarket Billing System</h1>
<p>Enter quantity and unit price for three products.</p>
<table>
<tr><th>Product</th><th>Quantity</th><th>Unit Price (₹)</th></tr>
<tr><td>Product 1</td><td><input id="q1" type="number" min="0" value="1"></td><td><input id="p1" type="number" min="0" value="500"></td></tr>
<tr><td>Product 2</td><td><input id="q2" type="number" min="0" value="1"></td><td><input id="p2" type="number" min="0" value="800"></td></tr>
<tr><td>Product 3</td><td><input id="q3" type="number" min="0" value="1"></td><td><input id="p3" type="number" min="0" value="900"></td></tr>
</table>
<button onclick="generateBill()">Generate Bill</button>
<div id="bill"></div>
</div>
<script>
function productAmount(quantity, price){
  return quantity * price;
}

function generateBill(){
  const q1 = Number(document.getElementById("q1").value);
  const p1 = Number(document.getElementById("p1").value);
  const q2 = Number(document.getElementById("q2").value);
  const p2 = Number(document.getElementById("p2").value);
  const q3 = Number(document.getElementById("q3").value);
  const p3 = Number(document.getElementById("p3").value);

  const item1 = productAmount(q1, p1);
  const item2 = productAmount(q2, p2);
  const item3 = productAmount(q3, p3);
  const total = item1 + item2 + item3;

  let discount = 0;
  if(total > 2000){
    discount = total * 0.10;
  }

  const payable = total - discount;

  document.getElementById("bill").innerHTML =
    "<b>Product 1:</b> ₹" + item1.toFixed(2) + "<br>" +
    "<b>Product 2:</b> ₹" + item2.toFixed(2) + "<br>" +
    "<b>Product 3:</b> ₹" + item3.toFixed(2) + "<br><hr>" +
    "<b>Total Bill:</b> ₹" + total.toFixed(2) + "<br>" +
    "<b>Discount:</b> ₹" + discount.toFixed(2) + "<br>" +
    "<b>Final Payable Amount:</b> ₹" + payable.toFixed(2);
}
</script>
</body>
</html>
